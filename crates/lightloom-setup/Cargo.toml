# SPDX-License-Identifier: GPL-3.0-or-later
[package]
publish = false
name = "lightloom-setup"
description = "lightloom-setup: the elevated helper of RAM lighting: verified download and silent install of the official PawnIO driver on request, registration of the Lightloom I/O broker service with its hash-pinned PawnIO modules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true

[[bin]]
name = "lightloom-setup"
path = "src/main.rs"

[dependencies]
lightloom-iobroker = { path = "../lightloom-iobroker" }
# PawnIO presence, the helper contract (exit codes, arguments), UAC relaunch.
lightloom-hal-windows = { path = "../lightloom-hal-windows" }

[target.'cfg(windows)'.dependencies]
windows-service = { workspace = true }
# The client SID from the process token.
# WinHTTP download, WinVerifyTrust.
windows = { workspace = true }

[build-dependencies]
lightloom-winres = { path = "../lightloom-winres" }
