# SPDX-License-Identifier: GPL-3.0-or-later
[package]
publish = false
name = "lightloom-hal-windows"
description = "Lightloom HAL backends for Windows: hidapi (hid.dll) HID enumeration/I/O with &MI_xx / &ColNN endpoint parsing, the I/O broker client (chipset SMBus) and PawnIO presence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true

[dependencies]
lightloom-hal = { path = "../lightloom-hal" }
lightloom-hid-desc = { path = "../lightloom-hid-desc" }
lightloom-protocol = { path = "../lightloom-protocol" }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
hidapi = { workspace = true, features = ["windows-native"] }
# cfgmgr32 (CM_Locate_DevNode / CM_Get_Parent) parent grouping and HIDP_CAPS probing;
# SendInput, the clipboard and low-level hooks of the macro runtime (`input`).
windows = { workspace = true, features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory"] }
# Also WinRT Windows.Devices.Lights (LampArray) and the package-identity check.
# Raw USB over WinUSB (`Type() == "rawusb"` / `"hybrid"` plugins).
nusb = { workspace = true }

# COM port enumeration (SetupAPI, USB VID:PID of the parent) and port I/O;
# the I/O half (`serial::open_port`) is shared with lightloom-hal-linux.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
serialport = { workspace = true }
