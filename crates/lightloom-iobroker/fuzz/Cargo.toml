# SPDX-License-Identifier: GPL-3.0-or-later
# cargo-fuzz targets of the io-broker (nightly + libFuzzer; Linux). Not a
# workspace member: see README.md here.
[package]
name = "lightloom-iobroker-fuzz"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lightloom-iobroker = { path = "..", features = ["fuzzing"] }

# Its own workspace, out of the main one (`exclude` in the root Cargo.toml).
[workspace]
members = ["."]

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session"
path = "fuzz_targets/session.rs"
test = false
doc = false
bench = false
