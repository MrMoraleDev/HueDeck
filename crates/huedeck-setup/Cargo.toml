# SPDX-License-Identifier: GPL-3.0-or-later
[package]
publish = false
name = "huedeck-setup"
description = "huedeck-setup: one-shot elevated registration of the HueDeck I/O broker service (RAM lighting over SMBus) with its hash-pinned PawnIO modules; does not install PawnIO itself"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true

[[bin]]
name = "huedeck-setup"
path = "src/main.rs"

[dependencies]
huedeck-iobroker = { path = "../huedeck-iobroker" }

[target.'cfg(windows)'.dependencies]
windows-service = { workspace = true }
# The client SID from the process token.
windows = { workspace = true }
