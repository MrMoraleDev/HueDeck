# SPDX-License-Identifier: GPL-3.0-or-later
#
# Lightloom continuous integration.
#
# Jobs:
#   rust     - fmt / clippy / tests on Windows and Ubuntu (mock HAL, no hardware)
#   renderer-cef - lightloom-renderer with the opt-in `cef` feature (real Chromium host), Windows
#   deny     - cargo-deny: licenses (copyleft denied in-tree), advisories, bans, sources
#   node     - prelude JS shims, first-party plugin and SDK tests under Node 24 (node:test), dashboard check + build, SDK typings
#   schemas  - JSON Schema validation of the user-supplied corpus (skipped when absent)
#   msi      - the WiX MSI sources build (stand-in staged files), Windows
#
# Hardware conformance runs on a self-hosted runner in conformance-selfhosted.yml, not here.

name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # No hardware on hosted runners: the HAL falls back to the mock backend.
  LIGHTLOOM_HAL: mock

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libusb-1.0-0-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Failures are re-emitted as annotations (test names and panic messages), which the
      # public checks API exposes; full job logs need repository admin rights.
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --workspace 2>&1 | tee cargo-test.log; then
            grep -E "^test .* FAILED$|panicked at|^---- " cargo-test.log | head -40 | while IFS= read -r line; do
              echo "::error title=cargo test::${line}"
            done
            grep -A6 "panicked at" cargo-test.log | head -60 | tr '\n' ' ' | sed -e 's/^/::error title=panic context::/' -e 's/$/\n/'
            exit 1
          fi

  # The real CEF host of lightloom-renderer (opt-in `cef` feature). cef-dll-sys downloads the CEF
  # minimal distribution (~170 MB) into CEF_PATH on the first run and builds
  # libcef_dll_wrapper with CMake + Ninja; the distribution is cached by CEF version.
  renderer-cef:
    name: renderer (cef, windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-renderer-cef

      - name: Point CEF_PATH at the cached distribution
        shell: bash
        run: echo "CEF_PATH=$RUNNER_TEMP\\cef" >> "$GITHUB_ENV"

      - name: Cache CEF distribution
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\cef
          key: cef-154.0.34-windows-x86_64

      - name: cargo clippy + build (--features cef)
        shell: bash
        run: |
          . crates/lightloom-renderer/tools/cef-env.sh
          cargo clippy -p lightloom-renderer --features cef --all-targets -- -D warnings
          cargo build -p lightloom-renderer --features cef

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Policy lives in deny.toml at the repo root (graph.all-features, targets, lists).
      # The action defaults to `--all-features`; pass `--workspace` instead so deny.toml
      # stays the single source of truth for feature selection.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --workspace

  node:
    name: node (prelude + plugins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Node >= 21 no longer walks a bare directory argument (`node --test dir` fails with
      # MODULE_NOT_FOUND); pass a quoted glob so Node's own matcher expands it.
      - name: Prelude tests
        run: |
          if [ -d prelude/tests ]; then
            node --test "prelude/tests/**/*.test.{js,mjs}"
          else
            echo "::notice::prelude/tests not present yet - skipping"
          fi

      - name: Plugin tests
        run: |
          if [ -d plugins ] && find plugins -type f \( -name '*.test.js' -o -name '*.test.mjs' \) | grep -q .; then
            node --test "plugins/**/*.test.{js,mjs}"
          else
            echo "::notice::no plugin tests found under plugins/ - skipping"
          fi

      # The plugin SDK: lint and simulator tests (sdk/README.md).
      - name: SDK tests
        run: node --test "sdk/**/*.test.mjs"

      # The dashboard lightloomd serves: type-check (svelte-check) and build.
      # --ignore-scripts: no package runs install scripts; the bundler ships prebuilt binaries.
      - name: Dashboard
        working-directory: ui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run build

      # sdk/lightloom.d.ts, the example plugin (checkJs) and sdk/types-test, with the dashboard's tsc.
      - name: SDK typings
        run: ui/node_modules/.bin/tsc -p sdk

  schemas:
    name: schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate corpus against JSON Schemas
        run: |
          if [ -f tests/schemas/requirements.txt ]; then
            python -m pip install --quiet -r tests/schemas/requirements.txt
          fi
          if [ -f tests/schemas/validate_corpus.py ]; then
            python -I tests/schemas/validate_corpus.py --skip-if-missing-corpus
          else
            echo "::notice::tests/schemas/validate_corpus.py not present yet - skipping"
          fi

  # The WiX sources compile and pass ICE validation, on a stand-in staged build (empty
  # programs, the real pinned PawnIO modules); the real MSI is built in release.yml.
  msi:
    name: MSI (WiX check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the MSI from a stand-in stage
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP "stage"
          New-Item -ItemType Directory -Force "$stage/ui", "$stage/plugins/sample", "$stage/locales" | Out-Null
          foreach ($exe in "lightloomd", "lightloomw", "lightloom-tray", "lightloom", "lightloom-renderer", "lightloom-setup", "lightloom-iobroker") {
            Set-Content "$stage/$exe.exe" "stand-in"
          }
          Set-Content "$stage/ui/index.html" "<!doctype html>"
          Set-Content "$stage/plugins/sample/manifest.json" "{}"
          Set-Content "$stage/locales/en-US.pak" "stand-in"
          Copy-Item LICENSE, LICENSE-EXCEPTION.md, docs/privacy.md $stage
          tools/package/fetch-pawnio-modules.ps1 -Out "$stage/pawnio-modules"
          packaging/wix/build.ps1 -Stage $stage -InstallWix -Out "$env:RUNNER_TEMP/check/Lightloom-check.msi"
          packaging/wix/build.ps1 -Stage $stage -Culture it-IT -Out "$env:RUNNER_TEMP/check/Lightloom-check-it.msi"
      - uses: actions/upload-artifact@v7
        with:
          name: msi-check
          path: ${{ runner.temp }}/check/*.msi
          retention-days: 3
