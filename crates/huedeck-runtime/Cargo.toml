# SPDX-License-Identifier: GPL-3.0-or-later
[package]
publish = false
name = "huedeck-runtime"
description = "HueDeck device runtime shared by huedeck and huedeckd: HID enumeration for the plugin catalog, SMBus/GPU I2C buses (NvAPI, AMD ADL), hotplug, conflicting software, SignalRGB setup read in place"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true

[dependencies]
tracing = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
huedeck-hal = { path = "../huedeck-hal" }
huedeck-hal-windows = { path = "../huedeck-hal-windows" }
# hidraw backend and udev hotplug (its pure parts build everywhere).
huedeck-hal-linux = { path = "../huedeck-hal-linux" }
huedeck-nvapi = { path = "../huedeck-nvapi" }
huedeck-adl = { path = "../huedeck-adl" }
huedeck-plugin-host = { path = "../huedeck-plugin-host" }
huedeck-engine = { path = "../huedeck-engine" }
huedeck-effects = { path = "../huedeck-effects" }

[dev-dependencies]
huedeck-hal = { path = "../huedeck-hal", features = ["mock"] }
