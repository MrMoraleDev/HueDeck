ShortDescription: Open source RGB lighting manager. No account, no telemetry, no ads.
Description: |-
  HueDeck drives the RGB lighting of keyboards, mice, fans, graphics cards and RAM from one
  dashboard, with SignalRGB-format plugins and effects. It installs for the current user without
  administrator rights. RAM and motherboard lighting needs the PawnIO driver: a silent install
  (winget) does not set it up; use Settings > PawnIO / RAM lighting > Install in the dashboard
  (one Windows permission prompt).
