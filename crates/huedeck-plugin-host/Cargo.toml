[package]
publish = false
name = "huedeck-plugin-host"
description = "HueDeck SignalRGB-compatible plugin host: rquickjs runtime, compat host objects, device sessions, plugin catalog, corpus dry-run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
rquickjs = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
huedeck-hal = { path = "../huedeck-hal" }
huedeck-engine = { path = "../huedeck-engine" }

[dev-dependencies]
huedeck-hal = { path = "../huedeck-hal", features = ["mock"] }
