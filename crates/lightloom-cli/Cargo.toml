# SPDX-License-Identifier: GPL-3.0-or-later
[package]
publish = false
name = "lightloom-cli"
description = "lightloom: command-line client for Lightloom (devices, light, rainbow, bench, compat)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true

[[bin]]
name = "lightloom"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# `mock`: `lightloom bench --mock VID:PID` drives a scripted in-memory device.
lightloom-hal = { path = "../lightloom-hal", features = ["mock"] }
lightloom-hal-windows = { path = "../lightloom-hal-windows" }
lightloom-plugin-host = { path = "../lightloom-plugin-host" }
lightloom-engine = { path = "../lightloom-engine" }
lightloom-render = { path = "../lightloom-render" }
lightloom-effects = { path = "../lightloom-effects" }
lightloom-runtime = { path = "../lightloom-runtime" }
# NATIVE_PORT (the daemon's default port).
lightloom-api = { path = "../lightloom-api" }

# Ctrl-C on Unix; Windows uses lightloom_hal_windows::console (close/log-off/shutdown too).
[target.'cfg(not(windows))'.dependencies]
ctrlc = { workspace = true }
