[package]
publish = false
name = "lightloom-plugin-host"
description = "Lightloom SignalRGB-compatible plugin host: rquickjs runtime, compat host objects, device sessions, plugin catalog, corpus dry-run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
rquickjs = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
lightloom-hal = { path = "../lightloom-hal" }
lightloom-hid-desc = { path = "../lightloom-hid-desc" }
lightloom-engine = { path = "../lightloom-engine" }

[dev-dependencies]
lightloom-hal = { path = "../lightloom-hal", features = ["mock"] }
