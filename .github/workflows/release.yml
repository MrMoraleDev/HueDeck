#
# Lightloom release (tag-triggered).
#
# `build` runs release-build.yml (Windows zip + MSI, Linux tarball + AppImage, SBOMs,
# cargo-auditable, the reproducibility check, SHA256SUMS); `publish` turns its
# `lightloom-release` artifact into a draft GitHub release. The same build runs weekly and on
# demand without publishing: ci.yml `release-dry-run`.
#
# Before tagging: Cargo.toml's [workspace.package] version must equal the tag (v1.2.3 ->
# 1.2.3, a pre-release suffix aside), or the build stops; the in-app updater compares the
# version the binaries report with the tag.
#
# NOT YET: code signing (see SIGNING in release-build.yml). cargo-dist deferred
# (docs/linux-porting.md, "cargo-dist evaluation").

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag or ref to build (dry run: a manual run never publishes)"
        required: false
        default: ""

# Read-only by default; only `publish` gets `contents: write`.
permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/release-build.yml
    with:
      # Manual runs may name a tag; pushes build the tag that triggered them.
      ref: ${{ inputs.tag || github.ref }}

  publish:
    name: GitHub release (draft)
    needs: build
    runs-on: ubuntu-latest
    # Tag pushes only: a workflow_dispatch run stops after `build`, even when started on a tag,
    # and leaves its files on the run as a dry run.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: lightloom-release
          path: dist

      - name: Verify SHA256SUMS
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          ls -la

      # A draft: a maintainer checks the files and the notes and publishes it by hand. The
      # updater ignores drafts, and offers a tag with a pre-release suffix only to beta users.
      - name: Create the draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
