# SPDX-License-Identifier: GPL-3.0-or-later
[package]
publish = false
name = "huedeck-setup"
description = "huedeck-setup: the elevated helper of RAM lighting: verified download and silent install of the official PawnIO driver on request, registration of the HueDeck I/O broker service with its hash-pinned PawnIO modules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true

[[bin]]
name = "huedeck-setup"
path = "src/main.rs"

[dependencies]
huedeck-iobroker = { path = "../huedeck-iobroker" }
# PawnIO presence, the helper contract (exit codes, arguments), UAC relaunch.
huedeck-hal-windows = { path = "../huedeck-hal-windows" }

[target.'cfg(windows)'.dependencies]
windows-service = { workspace = true }
# The client SID from the process token.
# WinHTTP download, WinVerifyTrust.
windows = { workspace = true }

[build-dependencies]
huedeck-winres = { path = "../huedeck-winres" }
