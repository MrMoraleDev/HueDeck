# HueDeck: the group that owns /dev/i2c-* (see packaging/udev/70-huedeck.rules).
# Packages install this as /usr/lib/sysusers.d/huedeck.conf; manually:
#   sudo install -m 0644 huedeck.conf /etc/sysusers.d/ && sudo systemd-sysusers
# Debian's i2c-tools package creates the same group; an existing group is kept.
g i2c -
