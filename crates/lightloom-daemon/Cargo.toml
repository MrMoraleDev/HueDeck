# SPDX-License-Identifier: GPL-3.0-or-later
[package]
publish = false
name = "lightloom-daemon"
description = "lightloomd: the Lightloom per-user daemon (devices, effects, local API, dashboard)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "lightloomd"
path = "src/main.rs"

# Starts lightloomd without a console window (Start menu, sign-in).
[[bin]]
name = "lightloomw"
path = "src/bin/lightloomw.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
humantime = { workspace = true }
rusqlite = { workspace = true }
rusqlite_migration = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
arc-swap = { workspace = true }
uuid = { workspace = true }
toml = { workspace = true }
lightloom-api = { path = "../lightloom-api" }
lightloom-effects = { path = "../lightloom-effects" }
lightloom-engine = { path = "../lightloom-engine" }
lightloom-hal = { path = "../lightloom-hal" }
lightloom-inputs = { path = "../lightloom-inputs" }
lightloom-plugin-host = { path = "../lightloom-plugin-host" }
lightloom-render = { path = "../lightloom-render" }
lightloom-runtime = { path = "../lightloom-runtime" }
# lightloomw --autostart: the tray's Run-key logic.
lightloom-tray = { path = "../lightloom-tray" }

[dev-dependencies]
lightloom-hal = { path = "../lightloom-hal", features = ["mock"] }

[build-dependencies]
lightloom-winres = { path = "../lightloom-winres" }
