[workspace]
resolver = "2"
members = ["crates/*"]
# cargo-fuzz targets (nightly + libFuzzer) build as their own workspace.
exclude = ["crates/lightloom-iobroker/fuzz"]
default-members = ["crates/lightloom-cli", "crates/lightloom-daemon"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-or-later"
repository = "https://github.com/MrMoraleDev/Lightloom"
authors = ["Lightloom contributors"]
homepage = "https://github.com/MrMoraleDev/Lightloom"
description = "Lightloom — standalone open source RGB lighting manager: no account, no telemetry, no ads; runs SignalRGB-format plugins and effects"
keywords = ["rgb", "led", "hid", "signalrgb", "lighting"]
categories = ["hardware-support"]

# Pinned once here; crates use `{ workspace = true }`.
# Versions chosen 2026-10-17 (see docs/architecture-synthesis.md §2); bump deliberately.
[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal", "process"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
triple_buffer = "9"
arc-swap = "1"
clap = { version = "4", features = ["derive", "env"] }
hidapi = { version = "2.6", default-features = false }
nusb = "0.2"
serialport = "4.10"
rquickjs = { version = "0.14", features = ["loader", "array-buffer", "futures", "parallel"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
toml = "0.9"
tower-http = { version = "0.7", features = ["cors", "fs", "trace"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
scraper = "0.27"
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
sha2 = "0.11"
bytes = "1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_HumanInterfaceDevice", "Win32_Devices_Properties", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_IO", "Win32_System_Console", "Win32_System_Power", "Win32_System_SystemServices", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_NetworkManagement_IpHelper", "Win32_System_LibraryLoader", "Wdk_System_IO", "Wdk_System_SystemInformation", "Win32_System_Pipes", "Win32_Security_Authorization", "Win32_System_Services", "Win32_System_WinRT", "Win32_Storage_Packaging_Appx", "Foundation", "Data_Xml_Dom", "UI", "UI_Notifications", "Devices_Enumeration", "Devices_Lights"] }
windows-service = "0.8"
libc = "0.2"
humantime = "2"
# Ctrl-C / Ctrl-Break handling in the CLI (restores device state on interrupt).
ctrlc = "3.4"
# SPIKE A (lightloom-renderer): CEF offscreen Chromium + memory-mapped shm ring. CEF itself is BSD-3.
cef = { version = "=154.5.0", default-features = false }
memmap2 = "0.9"
# Property-based tests and the fuzz harness of the io-broker (dev-dependency only).
proptest = { version = "1.12", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.dev]
opt-level = 0
debug = 1
