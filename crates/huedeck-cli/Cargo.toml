# SPDX-License-Identifier: GPL-3.0-or-later
[package]
publish = false
name = "huedeck-cli"
description = "huedeck: command-line client for HueDeck (devices, light, rainbow, bench, compat)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true

[[bin]]
name = "huedeck"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# `mock`: `huedeck bench --mock VID:PID` drives a scripted in-memory device.
huedeck-hal = { path = "../huedeck-hal", features = ["mock"] }
huedeck-hal-windows = { path = "../huedeck-hal-windows" }
huedeck-plugin-host = { path = "../huedeck-plugin-host" }
huedeck-engine = { path = "../huedeck-engine" }
huedeck-render = { path = "../huedeck-render" }
huedeck-effects = { path = "../huedeck-effects" }
huedeck-runtime = { path = "../huedeck-runtime" }
# NATIVE_PORT (the daemon's default port).
huedeck-api = { path = "../huedeck-api" }

# Ctrl-C on Unix; Windows uses huedeck_hal_windows::console (close/log-off/shutdown too).
[target.'cfg(not(windows))'.dependencies]
ctrlc = { workspace = true }

[build-dependencies]
huedeck-winres = { path = "../huedeck-winres" }
