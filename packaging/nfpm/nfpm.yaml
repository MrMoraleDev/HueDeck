# SPDX-License-Identifier: GPL-3.0-or-later
#
# Lightloom .deb and .rpm (nFPM). Not used directly: packaging/nfpm/build-packages.sh lays out
# the package root from a staged Linux build (tools/package/stage-linux.sh) and runs nfpm from
# that directory (every `src` below is relative to it) with LIGHTLOOM_VERSION set.
#
# Layout:
#   /usr/lib/lightloom/                 the staged build (daemon, CLI, CEF renderer + runtime,
#                                       dashboard, plugins, effects, faces, launcher)
#   /usr/bin/lightloomd, /usr/bin/lightloom   symlinks into it (the daemon finds its resources
#                                       next to the real executable)
#   /usr/lib/systemd/user/lightloomd.service  the user unit, ExecStart=/usr/bin/lightloomd;
#                                       never enabled by the package
#   /usr/lib/udev/rules.d/70-lightloom.rules, /usr/lib/sysusers.d/lightloom.conf,
#   /usr/lib/modules-load.d/lightloom.conf
#   /usr/share/applications, icons, metainfo   desktop integration under the Flathub app id
#   /usr/share/doc/lightloom, /usr/share/licenses/lightloom   docs and licences

name: lightloom
arch: amd64
platform: linux
version: ${LIGHTLOOM_VERSION}
version_schema: semver
release: "1"
section: utils
priority: optional
maintainer: Lightloom contributors <MrMoraleDev@users.noreply.github.com>
vendor: Lightloom contributors
homepage: https://github.com/MrMoraleDev/Lightloom
license: GPL-3.0-or-later
description: |-
  Open source RGB lighting manager
  Lightloom drives the RGB lighting of keyboards, mice, headsets, RAM,
  graphics cards, motherboards, fans and LED strips from one daemon, with
  a dashboard in the browser, device plugins written in JavaScript and
  canvas effects. It runs as the user, never as root: the package installs
  udev rules that give the logged-in user access to the supported devices.
  Start it with the session: systemctl --user enable --now lightloomd
changelog: changelog.yaml
umask: 0o022

# Chromium's runtime libraries for the CEF effect renderer (the list ci.yml and the
# release workflow install, Ubuntu 24.04 / Debian 13 `t64` names), and libpipewire for the
# Wayland screen capture. glibc 2.39 is the baseline the release is built against.
depends:
  - libc6 (>= 2.39)
  - libgcc-s1
  - libpipewire-0.3-0t64
  - libnss3
  - libnspr4
  - libgbm1
  - libdrm2
  - libasound2t64
  - libcups2t64
  - libdbus-1-3
  - libexpat1
  - libxkbcommon0
  - libx11-6
  - libx11-xcb1
  - libxcb1
  - libxcomposite1
  - libxdamage1
  - libxext6
  - libxfixes3
  - libxrandr2
  - libxshmfence1
  - libpango-1.0-0
  - libcairo2
  - libatk1.0-0t64
  - libatk-bridge2.0-0t64
  - libatspi2.0-0t64
recommends:
  - fonts-liberation
  - xdg-utils

overrides:
  # The same libraries under their Fedora (40 and later) names.
  rpm:
    depends:
      - glibc >= 2.39
      - libgcc
      - pipewire-libs
      - nss
      - nspr
      - mesa-libgbm
      - libdrm
      - alsa-lib
      - cups-libs
      - dbus-libs
      - expat
      - libxkbcommon
      - libX11
      - libX11-xcb
      - libxcb
      - libXcomposite
      - libXdamage
      - libXext
      - libXfixes
      - libXrandr
      - libxshmfence
      - pango
      - cairo
      - atk
      - at-spi2-atk
      - at-spi2-core
    recommends:
      - liberation-fonts
      - xdg-utils

contents:
  - src: lib/
    dst: /usr/lib/lightloom
    type: tree
  - src: /usr/lib/lightloom/lightloomd
    dst: /usr/bin/lightloomd
    type: symlink
    file_info: { mode: 0777 }
  - src: /usr/lib/lightloom/lightloom
    dst: /usr/bin/lightloom
    type: symlink
    file_info: { mode: 0777 }
  - src: lightloomd.service
    dst: /usr/lib/systemd/user/lightloomd.service
    file_info: { mode: 0644 }
  - src: lib/packaging/udev/70-lightloom.rules
    dst: /usr/lib/udev/rules.d/70-lightloom.rules
    file_info: { mode: 0644 }
  - src: lib/packaging/sysusers.d/lightloom.conf
    dst: /usr/lib/sysusers.d/lightloom.conf
    file_info: { mode: 0644 }
  - src: lib/packaging/modules-load.d/lightloom.conf
    dst: /usr/lib/modules-load.d/lightloom.conf
    file_info: { mode: 0644 }
  - src: io.github.MrMoraleDev.Lightloom.desktop
    dst: /usr/share/applications/io.github.MrMoraleDev.Lightloom.desktop
    file_info: { mode: 0644 }
  - src: io.github.MrMoraleDev.Lightloom.svg
    dst: /usr/share/icons/hicolor/scalable/apps/io.github.MrMoraleDev.Lightloom.svg
    file_info: { mode: 0644 }
  - src: io.github.MrMoraleDev.Lightloom.png
    dst: /usr/share/icons/hicolor/512x512/apps/io.github.MrMoraleDev.Lightloom.png
    file_info: { mode: 0644 }
  - src: io.github.MrMoraleDev.Lightloom.metainfo.xml
    dst: /usr/share/metainfo/io.github.MrMoraleDev.Lightloom.metainfo.xml
    file_info: { mode: 0644 }
  # Docs and licences. Debian wants copyright (DEP-5) in /usr/share/doc/<package>; Fedora
  # marks licence texts %license under /usr/share/licenses/<package>.
  - src: doc/
    dst: /usr/share/doc/lightloom
    type: tree
  - src: copyright
    dst: /usr/share/doc/lightloom/copyright
    packager: deb
    file_info: { mode: 0644 }
  - src: lib/LICENSE
    dst: /usr/share/licenses/lightloom/LICENSE
    type: license
    packager: rpm
    file_info: { mode: 0644 }
  - src: lib/LICENSE-EXCEPTION.md
    dst: /usr/share/licenses/lightloom/LICENSE-EXCEPTION.md
    type: license
    packager: rpm
    file_info: { mode: 0644 }

scripts:
  postinstall: postinstall.sh
  postremove: postremove.sh

rpm:
  summary: Open source RGB lighting manager
  group: Applications/System
  # xz, not zstd: Ubuntu's rpm2cpio (used by rpmlint in the release job) cannot unpack a zstd
  # payload, and every rpm-based distribution reads xz.
  compression: xz
deb:
  compression: zstd
  fields:
    Bugs: https://github.com/MrMoraleDev/Lightloom/issues
    Vcs-Browser: https://github.com/MrMoraleDev/Lightloom
    Vcs-Git: https://github.com/MrMoraleDev/Lightloom.git
