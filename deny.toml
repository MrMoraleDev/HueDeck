# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
[graph]
# All features, so the opt-in `cef` graph of lightloom-renderer is checked too.
all-features = true
targets = [
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
version = 2
ignore = []

[licenses]
version = 2
# Lightloom is GPL-3.0-or-later (ADR-0010): every dependency must be usable in a GPLv3
# program. Apache-2.0-only and MPL-2.0 crates are; GPL-2.0-only and the OpenSSL
# license are not, so they are not listed. GPL-3.0-or-later is Lightloom's own crates.
allow = [
  "GPL-3.0-or-later",
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "MPL-2.0", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "0BSD",
  "BSL-1.0",
]
confidence-threshold = 0.8
# Build-only dependencies of cef-dll-sys -> download-cef (fetches and unpacks the CEF binary
# distribution at build time; nothing of them ships in a Lightloom binary).
exceptions = [
  { allow = ["bzip2-1.0.6"], crate = "libbz2-rs-sys" },
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal `path = "../x"` dependencies carry no version on purpose.
allow-wildcard-paths = true
highlight = "all"
deny = [
  # vulnerable / unmaintained low-level IO drivers must never enter the tree
  { crate = "winring0", reason = "vulnerable driver; Lightloom uses PawnIO through lightloom-iobroker only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
