# SPDX-License-Identifier: GPL-3.0-or-later
[package]
publish = false
name = "huedeck-daemon"
description = "huedeckd: the HueDeck per-user daemon (devices, effects, local API, dashboard)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "huedeckd"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
humantime = { workspace = true }
rusqlite = { workspace = true }
rusqlite_migration = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
arc-swap = { workspace = true }
uuid = { workspace = true }
toml = { workspace = true }
huedeck-api = { path = "../huedeck-api" }
huedeck-engine = { path = "../huedeck-engine" }
huedeck-hal = { path = "../huedeck-hal" }
huedeck-inputs = { path = "../huedeck-inputs" }
huedeck-plugin-host = { path = "../huedeck-plugin-host" }
huedeck-render = { path = "../huedeck-render" }
huedeck-runtime = { path = "../huedeck-runtime" }

[dev-dependencies]
huedeck-hal = { path = "../huedeck-hal", features = ["mock"] }
