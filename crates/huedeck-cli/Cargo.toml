[package]
publish = false
name = "huedeck-cli"
description = "huedeck: command-line client for HueDeck (devices, light, rainbow, bench, compat)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true

[[bin]]
name = "huedeck"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
huedeck-hal = { path = "../huedeck-hal" }
huedeck-hal-windows = { path = "../huedeck-hal-windows" }
huedeck-plugin-host = { path = "../huedeck-plugin-host" }
