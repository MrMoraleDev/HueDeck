# SPDX-License-Identifier: GPL-3.0-or-later
#
# HueDeck release skeleton (tag-triggered).
#
# Status: PLACEHOLDER. The intended final shape is a cargo-dist generated workflow
# (`cargo dist init` writes .github/workflows/release.yml and dist-workspace.toml);
# until cargo-dist is wired in, this hand-written job builds the daemon and CLI with
# cargo-auditable on both targets, emits a CycloneDX SBOM, and uploads the artifacts.
#
# NOT YET: code signing. See the "SIGNING" block below for where SignPath goes.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (dry run when empty)"
        required: false
        default: ""

# Read-only by default; only the `release` job gets `contents: write`.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Binaries that ship in the release archives (space separated).
  HUEDECK_BINS: huedeckd huedeck

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          # Manual runs may name a tag; pushes build the ref that triggered them.
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libusb-1.0-0-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      # cargo-auditable embeds the exact dependency tree into each binary
      # (readable later with `cargo audit bin`); cargo-cyclonedx writes the SBOM file.
      - name: Install cargo-auditable and cargo-cyclonedx
        run: cargo install --locked cargo-auditable cargo-cyclonedx

      - name: Build (auditable, release)
        run: cargo auditable build --release --workspace --target ${{ matrix.target }}

      # Windows ships the effect renderer with its CEF runtime (the `cef` feature downloads the
      # CEF minimal distribution into CEF_PATH and builds libcef_dll_wrapper with CMake + Ninja,
      # as in the CI job) and the dashboard; tools/package/stage-windows.ps1 assembles them.
      - name: Point CEF_PATH at the cached distribution
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CEF_PATH=$RUNNER_TEMP\\cef" >> "$GITHUB_ENV"

      - name: Cache CEF distribution
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\cef
          key: cef-154.0.34-windows-x86_64

      - name: Build the effect renderer (auditable, release, --features cef)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          . crates/huedeck-renderer/tools/cef-env.sh
          cargo auditable build --release -p huedeck-renderer --features cef --target ${{ matrix.target }}

      - uses: actions/setup-node@v7
        if: runner.os == 'Windows'
        with:
          node-version: "24"

      - name: Build the dashboard
        if: runner.os == 'Windows'
        working-directory: ui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      # cargo-cyclonedx writes one <crate>.cdx.json per workspace member next to that
      # crate's Cargo.toml. Collect them into sbom/ and suffix the target so the two
      # matrix legs do not collide once the artifacts are merged in the release job.
      - name: SBOM (CycloneDX)
        shell: bash
        run: |
          set -eu
          cargo cyclonedx --format json --target "${{ matrix.target }}"
          mkdir -p sbom
          find . \( -path ./target -o -path ./sbom \) -prune -o -name '*.cdx.json' -print |
            while read -r f; do
              n="$(basename "$f" .cdx.json)"
              mv "$f" "sbom/${n}-${{ matrix.target }}.cdx.json"
            done
          ls -la sbom

      # ---------------------------------------------------------------------------
      # SIGNING (not enabled yet)
      #
      # Windows: Authenticode through SignPath Foundation (OSS program).
      #   - Insert `signpath/github-action-submit-signing-request@v1` here, after the
      #     build and before archiving, with organization-id / project-slug /
      #     signing-policy-slug stored as repository secrets. The WiX MSI from
      #     packaging/wix is signed the same way in the `msi` job.
      #   - Point the signing request at the artifact uploaded below so SignPath can
      #     verify provenance (origin verification against this workflow).
      # Linux: detached minisign signature of the tarball + SHA256SUMS; key in a
      #   repository secret; public key published in docs/security.md.
      # ---------------------------------------------------------------------------

      - name: Stage artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eu
          out="dist/huedeck-${{ matrix.target }}"
          mkdir -p "$out"
          for b in $HUEDECK_BINS; do
            cp "target/${{ matrix.target }}/release/$b" "$out/"
          done
          for f in LICENSE LICENSE-EXCEPTION.md README.md \
            packaging/systemd/huedeckd.service packaging/udev/70-huedeck.rules \
            packaging/sysusers.d/huedeck.conf; do
            if [ -f "$f" ]; then cp "$f" "$out/"; fi
          done
          # SBOMs ship inside the archive and beside it (everything uploaded lives under
          # dist/ so download-artifact + merge-multiple lands flat in the release job).
          cp sbom/*.cdx.json "$out/"
          cp sbom/*.cdx.json dist/
          tar -C dist -czf "dist/huedeck-${{ matrix.target }}.tar.gz" "huedeck-${{ matrix.target }}"
          (cd dist && sha256sum "huedeck-${{ matrix.target }}.tar.gz" > "huedeck-${{ matrix.target }}.sha256")

      - name: Stage artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $target = "${{ matrix.target }}"
          $out = "dist/huedeck-$target"
          # Daemon, CLI, renderer + CEF runtime, dashboard, plugins, effects, licenses and the
          # Chromium notices, laid out the way huedeckd looks for them (next to itself).
          tools/package/stage-windows.ps1 -Release "target/$target/release" -Ui "ui/dist" -Out $out
          Copy-Item "sbom/*.cdx.json" $out
          Copy-Item "sbom/*.cdx.json" "dist"
          # Archive the directory itself so the zip has the same huedeck-<target>/ root
          # as the Linux tarball.
          Compress-Archive -Path $out -DestinationPath "dist/huedeck-$target.zip" -Force
          $hash = (Get-FileHash "dist/huedeck-$target.zip" -Algorithm SHA256).Hash.ToLower()
          # LF only: the release job concatenates these into SHA256SUMS for `sha256sum -c`.
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "dist/huedeck-$target.sha256"),
            "$hash  huedeck-$target.zip`n")

      - uses: actions/upload-artifact@v7
        with:
          name: huedeck-${{ matrix.target }}
          # Keep every path under dist/ so the artifact root is dist/ (not the repo
          # root) and the release job's globs match after merge-multiple.
          path: |
            dist/huedeck-${{ matrix.target }}.${{ matrix.archive }}
            dist/huedeck-${{ matrix.target }}.sha256
            dist/*.cdx.json
          if-no-files-found: error

  # Placeholder for the WiX MSI (packaging/wix). Enable once huedeck.wxs exists.
  # msi:
  #   needs: build
  #   runs-on: windows-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: actions/download-artifact@v8
  #       with:
  #         name: huedeck-x86_64-pc-windows-msvc
  #         path: dist
  #     - run: dotnet tool install --global wix
  #     - run: wix build packaging/wix/huedeck.wxs -o dist/huedeck-x64.msi
  #     # SignPath signing of the MSI goes here.
  #     - uses: actions/upload-artifact@v7
  #       with:
  #         name: huedeck-msi
  #         path: dist/huedeck-x64.msi

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    # Tag pushes only; a workflow_dispatch run (even with `tag` set) stops after the
    # build job and leaves its artifacts on the run as a dry run.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Combined checksums
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          ls -la

      - name: Publish draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.cdx.json
            dist/SHA256SUMS
