# SPDX-License-Identifier: GPL-3.0-or-later
[package]
publish = false
name = "huedeck-hal-linux"
description = "HueDeck HAL backends for Linux: hidraw with the report-descriptor TLC split (Windows-identical endpoint tuples), udev netlink hotplug; /dev/i2c-* SMBus, hwmon sensors; nusb and serial follow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true

[dependencies]
huedeck-hal = { path = "../huedeck-hal" }
huedeck-hid-desc = { path = "../huedeck-hid-desc" }
# The I/O broker's write allowlist, mirrored on Linux chipset buses.
huedeck-protocol = { path = "../huedeck-protocol" }
# Pure parts only (path parsing, device grouping, `DeviceGroup`): the same
# identity and tuple rules as Windows. Its OS modules are `cfg(windows)`.
huedeck-hal-windows = { path = "../huedeck-hal-windows" }
tracing = { workspace = true }

# Raw hidraw ioctls, poll and the netlink uevent socket (no libudev, no C build).
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
