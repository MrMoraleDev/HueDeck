#
# HueDeck: load i2c-dev at boot so the SMBus adapters (RAM, GPU lighting) get /dev/i2c-* nodes.
# Packages install this as /usr/lib/modules-load.d/huedeck.conf; manually:
#   sudo install -m 0644 huedeck.conf /etc/modules-load.d/ && sudo modprobe i2c-dev
i2c-dev
