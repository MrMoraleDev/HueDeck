<!doctype html>

<html>
<head>
  <title>Plasma</title>
  <meta description="Sine plasma computed pixel by pixel." />
  <meta publisher="Lightloom" />
  <meta property="speed" label="Speed" type="number" min="1" max="100" default="30" />
  <meta property="scale" label="Scale" type="number" min="10" max="200" default="60" tooltip="Size of the blobs, percent" />
  <meta property="palette" label="Palette" type="combobox" values="Rainbow,Ocean,Lava" default="Rainbow" />
</head>
<body style="margin:0;padding:0;background:#000;overflow:hidden">
  <canvas id="exCanvas" width="320" height="200"></canvas>
  <script>
    var canvas = document.getElementById("exCanvas");
    var ctx = canvas.getContext("2d", { alpha: false });
    var W = canvas.width, H = canvas.height;
    var image = ctx.createImageData(W, H);
    var lut = new Uint8Array(256 * 3);
    var lutFor = "";
    var t = 0, last = 0;

    function num(v, fallback) {
      var n = Number(v);
      return isFinite(n) ? n : fallback;
    }

    function buildPalette(name) {
      for (var i = 0; i < 256; i++) {
        var a = (i / 256) * Math.PI * 2, r, g, b;
        if (name === "Ocean") {
          r = 0; g = 128 + 127 * Math.sin(a); b = 160 + 95 * Math.cos(a);
        } else if (name === "Lava") {
          r = 200 + 55 * Math.sin(a); g = 80 + 80 * Math.sin(a * 2); b = 0;
        } else {
          r = 128 + 127 * Math.sin(a); g = 128 + 127 * Math.sin(a + 2.094); b = 128 + 127 * Math.sin(a + 4.189);
        }
        lut[i * 3] = r; lut[i * 3 + 1] = g; lut[i * 3 + 2] = b;
      }
      lutFor = name;
    }

    function draw(now) {
      var dt = last ? Math.min((now - last) / 1000, 0.1) : 0;
      last = now;
      t += (dt * num(speed, 30)) / 15;
      var pal = typeof palette === "string" ? palette : "Rainbow";
      if (pal !== lutFor) buildPalette(pal);
      var k = (0.06 * 60) / Math.max(num(scale, 60), 10);
      var d = image.data, p = 0, cx = W / 2, cy = H / 2;
      for (var y = 0; y < H; y++) {
        for (var x = 0; x < W; x++) {
          var v = Math.sin(x * k + t) + Math.sin((y * k + t) * 0.7) +
            Math.sin((x + y) * k * 0.5 + t * 1.3) +
            Math.sin(Math.sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy)) * k - t);
          var i = ((v + 4) * 32) & 255;
          d[p] = lut[i * 3]; d[p + 1] = lut[i * 3 + 1]; d[p + 2] = lut[i * 3 + 2]; d[p + 3] = 255;
          p += 4;
        }
      }
      ctx.putImageData(image, 0, 0);
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  </script>
</body>
</html>
