# SPDX-License-Identifier: GPL-3.0-or-later
[package]
publish = false
name = "lightloom-hal"
description = "Lightloom hardware abstraction layer: HID/USB/serial/SMBus/hotplug/sensor/capture/audio/LampArray traits plus a mock backend for tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true

[features]
default = []
# Scripted in-memory backends and the transaction recorder used by golden tests
# and by the plugin simulator. Always on under `cargo test`.
mock = []

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
# HID traces (record/replay) are JSON.
serde_json = { workspace = true }
