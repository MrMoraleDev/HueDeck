version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      rust-minor-patch:
        update-types: ["minor", "patch"]
    labels: ["deps", "rust"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["deps", "ci"]

  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    labels: ["deps", "ui"]

  - package-ecosystem: npm
    directory: "/sdk"
    schedule:
      interval: weekly
      day: monday
    labels: ["deps", "sdk"]
