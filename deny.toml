# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = false
targets = [
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
version = 2
ignore = []

[licenses]
version = 2
# Permissive only inside the main tree. Copyleft (GPL/LGPL/AGPL) is denied:
# PawnIO modules we author live in a separate GPL-2 repository.
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "MPL-2.0", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "0BSD",
  "OpenSSL", "BSL-1.0",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal `path = "../x"` dependencies carry no version on purpose.
allow-wildcard-paths = true
highlight = "all"
deny = [
  # vulnerable / unmaintained low-level IO drivers must never enter the tree
  { crate = "winring0", reason = "vulnerable driver; Lightloom uses PawnIO through lightloom-iobroker only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
