# SPDX-License-Identifier: GPL-3.0-or-later
[package]
publish = false
name = "huedeck-hal-windows"
description = "HueDeck HAL backends for Windows: hidapi (hid.dll) HID enumeration/I/O with &MI_xx / &ColNN endpoint parsing, the I/O broker client (chipset SMBus) and PawnIO presence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true

[dependencies]
huedeck-hal = { path = "../huedeck-hal" }
huedeck-hid-desc = { path = "../huedeck-hid-desc" }
huedeck-protocol = { path = "../huedeck-protocol" }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
hidapi = { workspace = true, features = ["windows-native"] }
# cfgmgr32 (CM_Locate_DevNode / CM_Get_Parent) parent grouping and HIDP_CAPS probing.
windows = { workspace = true }
# Raw USB over WinUSB (`Type() == "rawusb"` / `"hybrid"` plugins).
nusb = { workspace = true }
