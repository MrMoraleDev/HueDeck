# SPDX-License-Identifier: GPL-3.0-or-later
[package]
publish = false
name = "huedeck-inputs"
description = "HueDeck input sources feeding engine.audio / engine.zone / engine.vision / sensors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true

[dependencies]
serde = { workspace = true }
tracing = { workspace = true }
# Windowed FFT for engine.audio (pure Rust, MIT/Apache-2.0).
realfft = "3.5"

[target.'cfg(windows)'.dependencies]
# WASAPI loopback of the default output device (Apache-2.0). Linux capture is WP-L6.
cpal = "0.18"
# Lock-free single-producer ring from the audio callback (MIT/Apache-2.0).
rtrb = "0.3"
# DXGI Desktop Duplication for engine.zone / engine.vision (MIT/Apache-2.0).
windows = { workspace = true, features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi"] }
